<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background square for maskable compliance -->
  <rect width="512" height="512" fill="url(#bgGradient)"/>

  <!-- Subtle glow in safe zone -->
  <circle cx="256" cy="256" r="170" fill="url(#glowGradient)" filter="blur(20px)"/>

  <!-- Shopping Bag Icon (centered in safe zone: 256, 256) -->
  <g filter="url(#shadow)">
    <!-- Bag Handle -->
    <path d="M196 200 C196 145, 316 145, 316 200" 
          fill="none" 
          stroke="url(#accentGradient)" 
          stroke-width="20" 
          stroke-linecap="round"/>

    <!-- Bag Body -->
    <path d="M156 210 L356 210 L336 375 C334 388, 323 398, 310 398 L202 398 C189 398, 178 388, 176 375 Z" 
          fill="url(#accentGradient)"/>

    <!-- Store Emblem Inside Bag -->
    <path d="M226 280 L256 310 L286 280" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <circle cx="256" cy="250" r="10" fill="#ffffff"/>
  </g>
</svg>
